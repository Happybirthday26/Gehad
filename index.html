<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>جهاد | معاينة الشخصية 3D - نسخة 2</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui;background:#dcd7d1}#canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:fixed;top:12px;left:12px;right:12px;background:#fffef5ec;border-radius:18px;padding:12px 16px;text-align:center;box-shadow:0 5px 25px #0002}h2{font-size:18px;margin:0 0 4px}p{font-size:12px;margin:0;color:#555}#status{position:fixed;bottom:16px;left:12px;right:12px;text-align:center;background:#fffdf4ec;border-radius:14px;padding:10px;font-size:13px}button{background:#2d4e53;color:white;border:0;border-radius:8px;padding:8px 14px;margin-top:6px}</style></head><body><canvas id="canvas"></canvas><div id="ui"><h2>جهاد — نموذج ثلاثي الأبعاد (نسخة ٢)</h2><p>اسحب بإصبعك لتدوير الشخصية • قرّب بإصبعين • وجه من الصورة المرجعية</p></div><div id="status">جاري تحميل الشخصية…</div><script src="https://cdn.babylonjs.com/babylon.js"></script><script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script><script>
const status=document.getElementById('status');const canvas=document.getElementById('canvas');
if(!window.BABYLON){status.textContent='تعذر تحميل مكتبة العرض. تأكد من اتصال الإنترنت.';}else{
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true});const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.85,.83,.80,1);
const cam=new BABYLON.ArcRotateCamera('camera',-Math.PI/2,Math.PI/2.13,3.15,new BABYLON.Vector3(0,1.03,0),scene);cam.attachControl(canvas,true);cam.lowerRadiusLimit=1.15;cam.upperRadiusLimit=5;cam.wheelDeltaPercentage=.015;cam.pinchDeltaPercentage=.01;cam.panningSensibility=0;
const hemi=new BABYLON.HemisphericLight('soft',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=1.3;const key=new BABYLON.DirectionalLight('key',new BABYLON.Vector3(-.6,-1,-.8),scene);key.intensity=.9;
const floor=BABYLON.MeshBuilder.CreateGround('floor',{width:20,height:20},scene);const fm=new BABYLON.StandardMaterial('floorMat',scene);fm.diffuseColor=new BABYLON.Color3(.83,.81,.78);floor.material=fm;
BABYLON.SceneLoader.ImportMeshAsync('','./','jihad_v2.glb',scene).then(res=>{status.innerHTML='المجسم ظهر ✓ — لفّ حواليه بإصبعك. <strong>دي نسخة تجريبية، مش موديل مطابق للصور من كل الزوايا.</strong>';}).catch(err=>{status.textContent='فشل تحميل ملف jihad_v2.glb: '+(err.message||err);});
engine.runRenderLoop(()=>scene.render());window.addEventListener('resize',()=>engine.resize());}
</script></body></html>
