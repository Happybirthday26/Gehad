<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>تجربة شخصية جهاد 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#e8e4df;font-family:Tahoma,Arial}canvas{display:block}#info{position:absolute;top:12px;right:12px;left:12px;background:#ffffffdf;border-radius:16px;padding:13px;text-align:center;box-shadow:0 5px 25px #0002}small{display:block;color:#555;margin-top:5px}#error{position:absolute;bottom:20px;right:10px;left:10px;text-align:center;color:#9c2832}</style></head><body><div id="info"><b>جهاد — تجربة مجسم ثلاثي الأبعاد</b><small>اسحب بإصبعك لتدوير الشخصية • قرّب بإصبعين • نموذج أولي غير مطابق للملامح</small></div><div id="error"></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#e8e4df');const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);camera.position.set(0,1.35,3.8);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x8e8991,2.2));let light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(-2,4,5);scene.add(light);let floor=new THREE.Mesh(new THREE.CircleGeometry(1.15,48),new THREE.MeshStandardMaterial({color:'#c9c2bb',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.018;scene.add(floor);const actor=new THREE.Group();scene.add(actor);new GLTFLoader().load('./jihad_character.glb',g=>{actor.add(g.scene)},undefined,e=>document.getElementById('error').textContent='تعذر تحميل المجسم: تأكد من رفع ملف GLB بجانب HTML');let dragging=false,px=0,py=0,angle=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;angle+=(e.clientX-px)*.012;px=e.clientX;py=e.clientY});renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('wheel',e=>{camera.position.z=Math.max(2.3,Math.min(6,camera.position.z+e.deltaY*.005))},{passive:true});function animate(){requestAnimationFrame(animate);actor.rotation.y=angle;camera.lookAt(0,.95,0);renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
